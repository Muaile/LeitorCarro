name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Compilar
        run: |
          mkdir work && unzip -q *.zip -d work
          DIR=$(dirname "$(find work -name 'settings.gradle*' | head -n 1)")
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: leitor-carro-apk
          path: work/**/build/outputs/apk/debug/*.apk
